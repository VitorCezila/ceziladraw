<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ceziladraw</title>
    <link rel="icon" type="image/png" href="/logo-icon.png?v=2" />
    <link rel="apple-touch-icon" href="/logo-icon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <!-- Canvas layer -->
      <div id="canvas-container"></div>

      <!-- Floating text editor spawned by TextTool -->
      <div id="text-editor-container"></div>

      <!-- Top toolbar (horizontal) -->
      <nav id="toolbar" aria-label="Drawing tools">
        <button class="tool-btn active" data-tool="select" title="Select (V)" aria-label="Select (shortcut: V)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 3l14 9-7 1-4 7z"/></svg>
        </button>
        <div class="toolbar-divider"></div>
        <button class="tool-btn" data-tool="rectangle" title="Rectangle (R)" aria-label="Rectangle (shortcut: R)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1"/></svg>
        </button>
        <button class="tool-btn" data-tool="diamond" title="Diamond (D)" aria-label="Diamond (shortcut: D)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="12,2 22,12 12,22 2,12"/></svg>
        </button>
        <button class="tool-btn" data-tool="ellipse" title="Ellipse (O)" aria-label="Ellipse (shortcut: O)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><ellipse cx="12" cy="12" rx="10" ry="7"/></svg>
        </button>
        <button class="tool-btn" data-tool="arrow" title="Arrow (A)" aria-label="Arrow (shortcut: A)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="9,5 19,5 19,15"/></svg>
        </button>
        <button class="tool-btn" data-tool="line" title="Line (L)" aria-label="Line (shortcut: L)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="4" y1="20" x2="20" y2="4"/></svg>
        </button>
        <button class="tool-btn" data-tool="pencil" title="Pencil (P)" aria-label="Pencil (shortcut: P)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
        </button>
        <button class="tool-btn" data-tool="text" title="Text (T)" aria-label="Text (shortcut: T)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="4,7 4,4 20,4 20,7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
        </button>
        <div class="toolbar-divider"></div>
        <button class="tool-btn" data-tool="hand" title="Hand / Pan (H)" aria-label="Hand / Pan (shortcut: H)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0m0 0v2M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v4"/><path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
        </button>
      </nav>

      <!-- Left properties panel -->
      <aside id="properties-panel" aria-label="Element properties">

        <!-- ── Stroke color ── -->
        <div class="prop-section" data-section="stroke">
          <span class="prop-label">Stroke</span>
          <div class="prop-row color-swatches" id="stroke-swatches">
            <button class="swatch" data-color="#ffffff" style="--sw-color:#ffffff" title="White" aria-label="Stroke color: white"></button>
            <button class="swatch" data-color="#ef4444" style="--sw-color:#ef4444" title="Red" aria-label="Stroke color: red"></button>
            <button class="swatch" data-color="#22c55e" style="--sw-color:#22c55e" title="Green" aria-label="Stroke color: green"></button>
            <button class="swatch" data-color="#3b82f6" style="--sw-color:#3b82f6" title="Blue" aria-label="Stroke color: blue"></button>
            <button class="swatch" data-color="#f97316" style="--sw-color:#f97316" title="Orange" aria-label="Stroke color: orange"></button>
            <button class="swatch active" data-color="#1e1e2e" style="--sw-color:#1e1e2e" title="Dark" aria-label="Stroke color: dark"></button>
          </div>
          <div class="prop-row hex-input-row">
            <span class="hex-preview" id="stroke-hex-preview" style="background:#1e1e2e" title="Pick color"></span>
            <input type="color" id="stroke-color-picker" class="color-picker-hidden" value="#1e1e2e" tabindex="-1" />
            <input type="text" id="stroke-hex-input" class="hex-input" maxlength="7" placeholder="#1e1e2e" spellcheck="false" autocomplete="off" />
          </div>
        </div>

        <!-- ── Background (fill) ── shown for shapes only -->
        <div class="prop-section" data-section="fill">
          <span class="prop-label">Background</span>
          <div class="prop-row color-swatches" id="fill-swatches">
            <button class="swatch active" data-color="transparent" title="No fill" aria-label="Fill color: none">
              <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><line x1="2" y1="14" x2="14" y2="2" stroke="#e11d48" stroke-width="2"/></svg>
            </button>
            <button class="swatch" data-color="#ef4444" style="--sw-color:#ef4444" title="Red" aria-label="Fill color: red"></button>
            <button class="swatch" data-color="#22c55e" style="--sw-color:#22c55e" title="Green" aria-label="Fill color: green"></button>
            <button class="swatch" data-color="#3b82f6" style="--sw-color:#3b82f6" title="Blue" aria-label="Fill color: blue"></button>
            <button class="swatch" data-color="#f97316" style="--sw-color:#f97316" title="Orange" aria-label="Fill color: orange"></button>
            <button class="swatch" data-color="#6b3e00" style="--sw-color:#6b3e00" title="Brown" aria-label="Fill color: brown"></button>
            <button class="swatch" id="fill-checker" data-color="checker" title="Transparent pattern" aria-label="Fill color: transparent pattern">
              <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
                <rect x="0" y="0" width="8" height="8" fill="#999"/>
                <rect x="8" y="8" width="8" height="8" fill="#999"/>
              </svg>
            </button>
          </div>
          <div class="prop-row hex-input-row">
            <span class="hex-preview hex-preview--transparent" id="fill-hex-preview" title="Pick color"></span>
            <input type="color" id="fill-color-picker" class="color-picker-hidden" value="#ffffff" tabindex="-1" />
            <input type="text" id="fill-hex-input" class="hex-input" maxlength="7" placeholder="transparent" spellcheck="false" autocomplete="off" />
          </div>
        </div>

        <!-- ── Stroke width ── shown for shapes -->
        <div class="prop-section" data-section="stroke-width">
          <span class="prop-label">Stroke width</span>
          <div class="prop-row btn-group">
            <button class="prop-btn sw-btn" data-width="1" title="Thin" aria-label="Stroke width: thin">
              <svg viewBox="0 0 24 12" aria-hidden="true"><line x1="2" y1="6" x2="22" y2="6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <button class="prop-btn sw-btn active" data-width="2" title="Medium" aria-label="Stroke width: medium">
              <svg viewBox="0 0 24 12" aria-hidden="true"><line x1="2" y1="6" x2="22" y2="6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
            </button>
            <button class="prop-btn sw-btn" data-width="3" title="Thick" aria-label="Stroke width: thick">
              <svg viewBox="0 0 24 12" aria-hidden="true"><line x1="2" y1="6" x2="22" y2="6" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>

        <!-- ── Stroke style ── shown for shapes -->
        <div class="prop-section" data-section="stroke-style">
          <span class="prop-label">Stroke style</span>
          <div class="prop-row btn-group">
            <button class="prop-btn ss-btn active" data-stroke-style="solid" title="Solid" aria-label="Stroke style: solid">
              <svg viewBox="0 0 24 12" aria-hidden="true"><line x1="2" y1="6" x2="22" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <button class="prop-btn ss-btn" data-stroke-style="dashed" title="Dashed" aria-label="Stroke style: dashed">
              <svg viewBox="0 0 24 12" aria-hidden="true"><line x1="2" y1="6" x2="22" y2="6" stroke="currentColor" stroke-width="2" stroke-dasharray="5,3" stroke-linecap="round"/></svg>
            </button>
            <button class="prop-btn ss-btn" data-stroke-style="dotted" title="Dotted" aria-label="Stroke style: dotted">
              <svg viewBox="0 0 24 12" aria-hidden="true"><line x1="2" y1="6" x2="22" y2="6" stroke="currentColor" stroke-width="2" stroke-dasharray="2,4" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>

        <!-- ── Sloppiness (roughness) ── shown for shapes -->
        <div class="prop-section" data-section="sloppiness">
          <span class="prop-label">Sloppiness</span>
          <div class="prop-row btn-group">
            <button class="prop-btn rough-btn" data-roughness="0" title="Architect" aria-label="Sloppiness: architect">
              <svg viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 6 L22 6"/></svg>
            </button>
            <button class="prop-btn rough-btn active" data-roughness="1.2" title="Artist" aria-label="Sloppiness: artist">
              <svg viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 7 C6 4, 10 9, 14 6 S20 5, 22 6"/></svg>
            </button>
            <button class="prop-btn rough-btn" data-roughness="2.5" title="Cartoonist" aria-label="Sloppiness: cartoonist">
              <svg viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 8 C5 3, 8 10, 12 5 S18 9, 22 4"/></svg>
            </button>
          </div>
        </div>

        <!-- ── Edges ── shown for rect only -->
        <div class="prop-section" data-section="edges">
          <span class="prop-label">Edges</span>
          <div class="prop-row btn-group">
            <button class="prop-btn edge-btn active" data-corner-style="sharp" title="Sharp" aria-label="Edges: sharp">
              <svg viewBox="0 0 24 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="14" rx="0"/></svg>
            </button>
            <button class="prop-btn edge-btn" data-corner-style="round" title="Round" aria-label="Edges: round">
              <svg viewBox="0 0 24 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="14" rx="5"/></svg>
            </button>
          </div>
        </div>

        <!-- ── Font family ── shown for text only -->
        <div class="prop-section" data-section="font-family">
          <span class="prop-label">Font family</span>
          <div class="prop-row btn-group">
            <button class="prop-btn ff-btn active" data-font-family="cursive" title="Handwritten" aria-label="Font family: handwritten">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 19 C8 5 16 5 20 19"/><line x1="7" y1="13" x2="17" y2="13"/></svg>
            </button>
            <button class="prop-btn ff-btn" data-font-family="sans-serif" title="Normal" aria-label="Font family: normal">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><line x1="5" y1="5" x2="5" y2="19"/><line x1="5" y1="5" x2="19" y2="5"/><line x1="5" y1="12" x2="14" y2="12"/></svg>
            </button>
            <button class="prop-btn ff-btn" data-font-family="monospace" title="Code" aria-label="Font family: code">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><polyline points="8,9 4,12 8,15"/><polyline points="16,9 20,12 16,15"/><line x1="12" y1="6" x2="11" y2="18"/></svg>
            </button>
            <button class="prop-btn ff-btn" data-font-family="serif" title="Serif" aria-label="Font family: serif">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="8" y1="5" x2="16" y2="5"/><line x1="9" y1="19" x2="15" y2="19"/></svg>
            </button>
          </div>
        </div>

        <!-- ── Font size ── shown for text only -->
        <div class="prop-section" data-section="font-size">
          <span class="prop-label">Font size</span>
          <div class="prop-row btn-group">
            <button class="prop-btn fs-btn" data-size="14" title="Small" aria-label="Font size: small">S</button>
            <button class="prop-btn fs-btn active" data-size="20" title="Medium" aria-label="Font size: medium">M</button>
            <button class="prop-btn fs-btn" data-size="28" title="Large" aria-label="Font size: large">L</button>
            <button class="prop-btn fs-btn" data-size="36" title="Extra Large" aria-label="Font size: extra large">XL</button>
          </div>
        </div>

        <!-- ── Text align ── shown for text only -->
        <div class="prop-section" data-section="text-align">
          <span class="prop-label">Text align</span>
          <div class="prop-row btn-group">
            <button class="prop-btn ta-btn active" data-align="left" title="Left" aria-label="Text align: left">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="10" y2="8"/><line x1="2" y1="12" x2="12" y2="12"/></svg>
            </button>
            <button class="prop-btn ta-btn" data-align="center" title="Center" aria-label="Text align: center">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><line x1="2" y1="4" x2="14" y2="4"/><line x1="4" y1="8" x2="12" y2="8"/><line x1="3" y1="12" x2="13" y2="12"/></svg>
            </button>
            <button class="prop-btn ta-btn" data-align="right" title="Right" aria-label="Text align: right">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><line x1="2" y1="4" x2="14" y2="4"/><line x1="6" y1="8" x2="14" y2="8"/><line x1="4" y1="12" x2="14" y2="12"/></svg>
            </button>
          </div>
        </div>

        <!-- ── Opacity ── always shown when element selected -->
        <div class="prop-section" data-section="opacity">
          <span class="prop-label">Opacity</span>
          <div class="prop-row opacity-row">
            <input type="range" id="opacity-slider" min="0" max="100" value="100" aria-label="Opacity" />
            <div class="opacity-labels">
              <span>0</span>
              <span id="opacity-value">100</span>
            </div>
          </div>
        </div>

        <!-- ── Layers ── always shown when element selected -->
        <div class="prop-section" data-section="layers">
          <span class="prop-label">Layers</span>
          <div class="prop-row btn-group">
            <button class="prop-btn layer-btn" id="btn-send-back" title="Send to back" aria-label="Send to back">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1" y="7" width="10" height="10" rx="1"/><rect x="9" y="3" width="10" height="10" rx="1" fill="var(--surface)" stroke-width="1.5"/><polyline points="13,7 13,3 17,3"/></svg>
            </button>
            <button class="prop-btn layer-btn" id="btn-send-backward" title="Send backward" aria-label="Send backward">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1" y="7" width="10" height="10" rx="1"/><rect x="9" y="3" width="10" height="10" rx="1" fill="var(--surface)" stroke-width="1.5"/><line x1="14" y1="7" x2="14" y2="3"/><polyline points="11,6 14,3 17,6"/></svg>
            </button>
            <button class="prop-btn layer-btn" id="btn-bring-forward" title="Bring forward" aria-label="Bring forward">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="9" y="7" width="10" height="10" rx="1"/><rect x="1" y="3" width="10" height="10" rx="1" fill="var(--surface)" stroke-width="1.5"/><line x1="6" y1="7" x2="6" y2="11"/><polyline points="3,8 6,11 9,8"/></svg>
            </button>
            <button class="prop-btn layer-btn" id="btn-bring-front" title="Bring to front" aria-label="Bring to front">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="9" y="7" width="10" height="10" rx="1"/><rect x="1" y="3" width="10" height="10" rx="1" fill="var(--surface)" stroke-width="1.5"/><polyline points="3,6 6,9 9,6"/></svg>
            </button>
          </div>
        </div>

        <!-- ── Actions ── always shown when element selected -->
        <div class="prop-section" data-section="actions">
          <span class="prop-label">Actions</span>
          <div class="prop-row btn-group">
            <button class="prop-btn action-btn" id="btn-duplicate" title="Duplicate" aria-label="Duplicate">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="6" y="6" width="11" height="11" rx="1"/><path d="M3 14V3h11"/></svg>
            </button>
            <button class="prop-btn action-btn" id="btn-delete" title="Delete" aria-label="Delete">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><polyline points="4,6 16,6"/><path d="M7 6V4h6v2"/><rect x="5" y="6" width="10" height="11" rx="1"/><line x1="8" y1="9" x2="8" y2="14"/><line x1="12" y1="9" x2="12" y2="14"/></svg>
            </button>
            <button class="prop-btn action-btn" id="btn-link" title="Copy link" aria-label="Copy link">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 12a4 4 0 0 0 5.66 0l2-2a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M12 8a4 4 0 0 0-5.66 0l-2 2a4 4 0 0 0 5.66 5.66l1-1"/></svg>
            </button>
          </div>
        </div>

      </aside>

      <!-- Bottom-right zoom controls -->
      <div id="zoom-controls">
        <button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
        <span id="zoom-label">100%</span>
        <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="zoom-reset" title="Reset zoom" aria-label="Reset zoom">⊙</button>
      </div>

      <!-- Top-left App Menu button -->
      <button id="btn-app-menu" title="Menu" aria-label="Open app menu" aria-haspopup="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <!-- Top-right actions -->
      <div id="actions-panel">
        <button id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo (Ctrl+Z)">↩</button>
        <button id="btn-redo" title="Redo (Ctrl+Y)" aria-label="Redo (Ctrl+Y)">↪</button>
        <div class="actions-divider"></div>
        <!-- Board picker button injected here by boardPicker.ts -->
        <div id="actions-bar" style="display:contents">
          <button id="btn-theme" title="Toggle dark mode" aria-label="Toggle dark mode">☀️</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
